name: dream_journal
description: A Flutter app for recording and analyzing dreams with AI insights.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  
  # Navigation
  go_router: ^12.1.3
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Database & Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # HTTP & API (for future AI integration)
  http: ^1.1.0
  dio: ^5.4.0
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Date & Time Utilities
  intl: ^0.18.1
  
  # UI Enhancements & Animations
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  
  # Charts for Analytics
  fl_chart: ^0.65.0
  
  # UUID Generation
  uuid: ^4.3.3
  
  # Logging (for debugging)
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Quality & Linting
  flutter_lints: ^3.0.1
  
  # JSON Code Generation
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  
  # Testing
  mockito: ^5.4.4

# Flutter Configuration
flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
  
  # Custom Fonts (we'll add these later)
  # fonts:
  #   - family: Nunito
  #     fonts:
  #       - asset: assets/fonts/Nunito-Regular.ttf
  #       - asset: assets/fonts/Nunito-Bold.ttf
  #         weight: 700